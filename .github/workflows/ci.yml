name: CI - Verificacion de Calidad SG-PROP

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Configurar entorno PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Verificar sintaxis PHP en src y tests
        run: |
          test -d src
          find src -name "*.php" -print0 | xargs -0 -n1 -P4 php -l
          if [ -d tests ]; then
            find tests -name "*.php" -print0 | xargs -0 -n1 -P4 php -l
          fi

      - name: Verificar reglas de seguridad (sin credenciales expuestas)
        run: |
          if grep -rnE "(password|secret|api_key|token)\s*=\s*['\"][^'\"]+['\"]" src/; then
            echo "Posible credencial detectada en src/"
            exit 1
          fi
